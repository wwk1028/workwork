services:
  redis:
    image: redis:alpine
    container_name: mt_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  api:
    build: .
    container_name: mt_api
    environment:
      DB_HOST: host.docker.internal
      DB_USER: root
      DB_PASSWORD: 123456
      DB_NAME: machine_translation
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      - redis
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  worker:
    build: .
    container_name: mt_worker
    environment:
      DB_HOST: host.docker.internal
      DB_USER: root
      DB_PASSWORD: 123456
      DB_NAME: machine_translation
      REDIS_URL: redis://redis:6379/0
    command: dramatiq backend.tasks --processes 2
    depends_on:
      - redis
      - api
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  ngrok:
    image: ngrok/ngrok:latest
    container_name: mt_ngrok
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN}
    command: http --domain=${NGROK_DOMAIN:-} api:8000
    depends_on:
      - api
    restart: unless-stopped

volumes:
  redis_data:
